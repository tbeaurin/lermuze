<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La Lermuze</title>
<meta name="theme-color" content="#16241e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="La Lermuze">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,400&display=swap" rel="stylesheet">
<style>
:root{
  --night:#16241e;        /* vert profond, repris de l'appli températures */
  --green:#243b32;
  --cream:#f5f2e9;
  --cream-2:#d9d3c2;
  --amber:#e0a04a;        /* ambre de la bière */
  --card:rgba(22,36,30,.58);
  --card-hover:rgba(36,59,50,.78);
  --line:rgba(245,242,233,.18);
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--night);color:var(--cream);font:16px/1.45 var(--sans);
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;
}
/* Fond : la photo agrandie et floutée (sa basse résolution ne se voit pas), assombrie */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--night)}
.bg::before{
  content:"";position:absolute;inset:-60px;
  background:url(img/la-lermuze.jpg) center/cover no-repeat;
  filter:blur(28px) saturate(1.15);transform:scale(1.1);opacity:.75;
}
.bg::after{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(120% 80% at 50% 20%,rgba(22,36,30,.35),rgba(22,36,30,.92) 70%),
    linear-gradient(to bottom,rgba(22,36,30,.2),var(--night));
}
main{
  flex:1;width:100%;max-width:880px;margin:0 auto;
  padding:max(40px,env(safe-area-inset-top)) 16px 28px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
}
/* Photo nette, en arche */
.photo{
  margin:0 0 26px;width:min(62vw,250px);aspect-ratio:4/5;
  border-radius:999px 999px 22px 22px;overflow:hidden;
  border:1px solid var(--line);
  box-shadow:0 24px 60px rgba(0,0,0,.45),0 0 0 8px rgba(245,242,233,.05);
  animation:rise .9s cubic-bezier(.2,.7,.2,1) both;
}
.photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 62%}
.eyebrow{
  margin:0 0 6px;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--amber);font-weight:650;
  animation:rise .9s .08s cubic-bezier(.2,.7,.2,1) both;
}
h1{
  margin:0;font-family:var(--serif);font-weight:600;letter-spacing:-.01em;line-height:1;
  font-size:clamp(46px,11vw,86px);
  animation:rise .9s .14s cubic-bezier(.2,.7,.2,1) both;
}
.tag{
  margin:12px 0 34px;font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(17px,3.6vw,20px);color:var(--cream-2);
  animation:rise .9s .2s cubic-bezier(.2,.7,.2,1) both;
}
.actions{
  width:100%;display:grid;grid-template-columns:1fr;gap:14px;
  animation:rise .9s .28s cubic-bezier(.2,.7,.2,1) both;
}
@media(min-width:640px){.actions{grid-template-columns:1fr 1fr}}
.card{
  display:flex;align-items:center;gap:16px;text-align:left;text-decoration:none;color:var(--cream);
  padding:20px 20px 20px 18px;border-radius:20px;min-height:96px;
  background:var(--card);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  transition:background .2s,transform .2s,border-color .2s;
  -webkit-tap-highlight-color:transparent;
}
.card:hover{background:var(--card-hover);border-color:rgba(224,160,74,.55);transform:translateY(-2px)}
.card:active{transform:scale(.985)}
.card:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.icon{
  flex:0 0 54px;height:54px;border-radius:16px;display:grid;place-items:center;
  background:rgba(224,160,74,.14);color:var(--amber);
}
.icon svg{width:27px;height:27px}
.txt{flex:1;min-width:0}
.txt strong{display:block;font-family:var(--serif);font-weight:600;font-size:21px;line-height:1.15}
.txt span{display:block;margin-top:4px;font-size:13.5px;color:var(--cream-2)}
.arrow{flex:0 0 auto;color:var(--cream-2);transition:transform .2s,color .2s}
.card:hover .arrow{transform:translateX(3px);color:var(--amber)}
footer{
  text-align:center;font-size:12px;color:rgba(245,242,233,.55);
  padding:14px 16px max(18px,env(safe-area-inset-bottom));
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-height:700px) and (min-width:640px){.photo{width:190px}.tag{margin-bottom:24px}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<main>
  <figure class="photo"><img src="img/la-lermuze.jpg" alt="Pizza à la burrata et au basilic, servie avec une bière artisanale"></figure>
  <p class="eyebrow">Restaurant · Ardèche</p>
  <h1>La Lermuze</h1>
  <p class="tag">Espace de gestion</p>

  <nav class="actions" aria-label="Applications">
    <a class="card" href="temps/">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
      <span class="txt"><strong>Suivi du temps de travail</strong><span>Heures des salariés, soldes et repas</span></span>
      <svg class="arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
    <a class="card" href="temperatures/">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 14.76V4a2 2 0 0 0-4 0v10.76a4 4 0 1 0 4 0z"/><path d="M12 9v8"/></svg></span>
      <span class="txt"><strong>Suivi des températures</strong><span>Relevés HACCP des frigos et congélateurs</span></span>
      <svg class="arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
  </nav>
</main>
<footer>Montée de la Croisette · 07530 Vallées-d’Antraigues-Asperjoc</footer>
</body>
</html>
